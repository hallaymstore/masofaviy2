name: Validate Masofaviy2

on:
  pull_request:
    branches: [main]
  push:
    branches: [upgrade/statistics-control-v2]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
