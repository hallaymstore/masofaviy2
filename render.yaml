services:
  - type: web
    name: masofaviy2-hallaym
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: APP_UTC_OFFSET_MINUTES
        value: "300"
      - key: LATE_AFTER_MINUTES
        value: "5"
      - key: PUBLIC_TIMETABLE_ENABLED
        value: "false"
      - key: LOGIN_MAX_ATTEMPTS
        value: "7"
      - key: LOGIN_WINDOW_MS
        value: "900000"
      - key: ALLOWED_ORIGINS
        value: https://masofaviy2-hallaym.onrender.com
