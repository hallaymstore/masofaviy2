<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Kitob yuklash · HALLAYM EDU</title>
  <style>
    :root{--bg:#f3f5fa;--card:#fff;--ink:#121835;--muted:#5b6386;--brand:#0b4fd8;--ok:#0c7a4f;--bad:#b3261e}
    @media (prefers-color-scheme:dark){:root{--bg:#0a0f24;--card:#121937;--ink:#eaedfa;--muted:#a1a9cc;--brand:#7ea6ff;--ok:#5fe0a8;--bad:#ff8a80}}
    *{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:16px}
    main{max-width:560px;margin:4vh auto;background:var(--card);border-radius:20px;padding:24px;box-shadow:0 20px 50px -30px rgba(0,0,0,.4)}
    h1{font-size:24px;margin:0 0 6px}p{margin:8px 0}.muted{color:var(--muted)}
    label{display:grid;gap:6px;font-weight:600;margin:14px 0}input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #c7cce0;background:var(--card);color:inherit;min-height:48px}
    .drop{border:2px dashed #9aa6d6;border-radius:16px;padding:22px;text-align:center;cursor:pointer;display:block}
    button{font:600 18px/1 inherit;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--brand);color:#fff;cursor:pointer;margin-top:10px}
    button[disabled]{opacity:.55;cursor:wait}#msg{font-weight:600;min-height:1.5em}#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
    :focus-visible{outline:4px solid #ffb000;outline-offset:3px}
  </style>
</head>
<body>
<main>
  <h1>📚 Audio kitob yuklash</h1>
  <p id="who" class="muted">Havola tekshirilmoqda…</p>
  <form id="f" hidden>
    <label class="drop">Kitob fayli (matnli PDF yoki TXT, 60 MB gacha)<input type="file" name="file" accept="application/pdf,.pdf,text/plain,.txt" required></label>
    <label>Kitob nomi<input name="title" maxlength="200" placeholder="Masalan: O‘tkan kunlar"></label>
    <label>Muallif (ixtiyoriy)<input name="author" maxlength="160"></label>
    <label>Kitob tili<select name="lang"><option value="uz">O‘zbek</option><option value="ru">Rus</option><option value="en">Ingliz</option></select></label>
    <label>Kim yuklayapti?<input name="from" maxlength="120" placeholder="Masalan: Onasi"></label>
    <button type="submit">Yuklash</button>
  </form>
  <p id="msg" role="status" aria-live="polite"></p>
  <p class="muted">Matnli PDF tezroq ochiladi. Skanerlangan kitobdagi matn talabaning qurilmasida taniladi va keyin ovozda o‘qiladi.</p>
</main>
<script src="/family-upload.js"></script>
</body>
</html>
